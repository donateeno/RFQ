<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFQ — เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="/login.js" defer></script>
</head>
<body>
  <div class="gate card">
    <div class="brand" style="justify-content:center;margin-bottom:12px"><span class="logo">RFQ</span><span>ขออนุมัติราคาพิเศษ</span></div>
    <p class="sub">เข้าสู่ระบบด้วยบัญชี Google ของบริษัท ({{ALLOWED_DOMAINS}})</p>
    <div id="g_id_onload" data-client_id="{{GOOGLE_CLIENT_ID}}" data-callback="rfqSignIn"{{HD}}
         data-auto_prompt="false" data-ux_mode="popup"></div>
    <div style="display:flex;justify-content:center;margin:18px 0">
      <div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with" data-shape="pill" data-logo_alignment="left"></div>
    </div>
    <p id="msg" class="sub" style="color:var(--danger)"></p>
    {{DEV_LOGIN}}
    <p class="sub" style="margin-top:14px;font-size:12px"><a href="/privacy">นโยบายความเป็นส่วนตัว</a></p>
  </div>
</body>
</html>
