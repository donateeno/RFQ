<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --surface-2: #f8f8f6;
    --border: #e2e2de;
    --ink: #1d1d1b;
    --ink-2: #55554f;
    --ink-3: #8a8a84;
    --accent: #0b5c6b;
    --accent-ink: #ffffff;
    --accent-soft: #e3f0f2;
    --danger: #b42318;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --neutral: #8a8a84;
    --good-bg: #e6f5e6;
    --warning-bg: #fff4dc;
    --serious-bg: #fdeee7;
    --critical-bg: #fbe7e7;
    --neutral-bg: #efefed;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --surface: #1c1c1a;
      --surface-2: #232321;
      --border: #34342f;
      --ink: #ececea;
      --ink-2: #b5b5ae;
      --ink-3: #85857e;
      --accent: #5fb7c6;
      --accent-ink: #0d2328;
      --accent-soft: #17343a;
      --danger: #f97066;
      --good-bg: #16301a;
      --warning-bg: #3a2e10;
      --serious-bg: #3a2318;
      --critical-bg: #3b1a1a;
      --neutral-bg: #2a2a27;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; }
  .brand-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .logo {
    width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .who { font-size: 12px; color: var(--ink-2); text-align: right; line-height: 1.3; }
  .role-chip {
    display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600; font-size: 11px; margin-left: 4px;
  }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a {
    text-decoration: none; color: var(--ink-2); padding: 8px 12px; border-bottom: 2px solid transparent;
    white-space: nowrap; font-weight: 500; display: flex; align-items: center; gap: 6px;
  }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs .sep { width: 1px; background: var(--border); margin: 8px 6px; flex: none; }
  .badge {
    background: var(--critical); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px;
    min-width: 20px; text-align: center; font-weight: 600;
  }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 120px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .sub { color: var(--ink-2); margin: 2px 0 0; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }

  /* ---------- cards & forms ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .card + .card { margin-top: 16px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  label, .label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .req::after { content: ' *'; color: var(--danger); }
  input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    outline: none; min-height: 40px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input:disabled { background: var(--surface-2); color: var(--ink-2); }
  input.num { text-align: right; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--ink-3); }
  .pct-wrap { position: relative; }
  .pct-wrap input { padding-right: 26px; }
  .pct-wrap::after { content: '%'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 13px; }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer;
    font-weight: 500; color: var(--ink-2);
  }
  .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer;
    font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.bad { background: var(--surface); border-color: var(--critical); color: var(--critical); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .spacer { flex: 1; }

  /* ---------- indicator ---------- */
  .ind {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 99px;
    font-weight: 600; font-size: 12px; white-space: nowrap; color: var(--ink);
  }
  .ind .dot { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }
  .ind.OKAY { background: var(--good-bg); } .ind.OKAY .dot { background: var(--good); }
  .ind.LOW { background: var(--warning-bg); } .ind.LOW .dot { background: var(--warning); color: #3a2a00; }
  .ind.VERY_LOW { background: var(--serious-bg); } .ind.VERY_LOW .dot { background: var(--serious); }
  .ind.LOSS { background: var(--critical-bg); } .ind.LOSS .dot { background: var(--critical); }
  .ind.NO_COST { background: var(--neutral-bg); } .ind.NO_COST .dot { background: var(--neutral); }

  .result {
    border-radius: var(--radius); padding: 20px; text-align: center; border: 1px solid var(--border);
    background: var(--surface-2); min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 8px;
  }
  .result .big { font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .result .big .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 18px; }
  .result.OKAY { background: var(--good-bg); border-color: transparent; } .result.OKAY .dot { background: var(--good); }
  .result.LOW { background: var(--warning-bg); border-color: transparent; } .result.LOW .dot { background: var(--warning); color: #3a2a00; }
  .result.VERY_LOW { background: var(--serious-bg); border-color: transparent; } .result.VERY_LOW .dot { background: var(--serious); }
  .result.LOSS { background: var(--critical-bg); border-color: transparent; } .result.LOSS .dot { background: var(--critical); }
  .result.NO_COST { background: var(--neutral-bg); border-color: transparent; } .result.NO_COST .dot { background: var(--neutral); }
  .result .msg { color: var(--ink-2); }
  .scale { display: flex; gap: 4px; margin-top: 10px; font-size: 11px; color: var(--ink-2); justify-content: center; flex-wrap: wrap; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-top: 12px; text-align: left; font-size: 13px; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .status {
    display: inline-block; padding: 1px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap;
    border: 1px solid var(--border); color: var(--ink-2); background: var(--surface);
  }
  .status.Pending { border-color: var(--warning); color: var(--ink); }
  .status.Approved { border-color: var(--good); color: var(--ink); background: var(--good-bg); }
  .status.Rejected { border-color: var(--critical); color: var(--ink); }
  .status.Expired, .status.Cancelled, .status.Closed { color: var(--ink-3); }

  .flag { display: inline-block; font-size: 11px; color: var(--ink-2); background: var(--neutral-bg); border-radius: 5px; padding: 0 6px; margin: 2px 4px 0 0; }
  .flag.warn { background: var(--warning-bg); color: var(--ink); }

  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .muted, .muted { color: var(--ink-3); font-size: 12px; }
  tr.sel td { background: var(--accent-soft); }
  tbody tr:hover td { background: var(--surface-2); }
  tbody tr.sel:hover td { background: var(--accent-soft); }
  .nowrap { white-space: nowrap; }

  @media (max-width: 720px) {
    table.cards thead { display: none; }
    table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
    table.cards tr { border-bottom: 1px solid var(--border); padding: 8px 4px; }
    table.cards td { border: none; padding: 3px 8px; display: block; text-align: right; overflow: hidden; }
    table.cards td::before { content: attr(data-label); color: var(--ink-3); font-size: 12px; float: left; margin-right: 12px; }
    table.cards td[data-label=""]::before { content: none; }
    table.cards td.num { white-space: normal; }
  }

  /* ---------- request lines ---------- */
  .line {
    display: grid; grid-template-columns: minmax(180px, 2.4fr) 80px 130px repeat(var(--disc-count, 3), 96px) 120px 36px;
    gap: 8px; align-items: end; padding: 10px 0; border-bottom: 1px dashed var(--border);
  }
  .line:last-of-type { border-bottom: none; }
  .line .ind-cell { padding-bottom: 8px; }
  .line .label { display: none; }
  .line-head { display: grid; grid-template-columns: minmax(180px, 2.4fr) 80px 130px repeat(var(--disc-count, 3), 96px) 120px 36px; gap: 8px; }
  .line-head span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .line .np { font-size: 12px; color: var(--ink-3); margin-top: 2px; min-height: 18px; }
  @media (max-width: 900px) {
    .line-head { display: none; }
    .line { grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .line .prod { grid-column: 1 / -1; }
    .line .label { display: block; }
  }
  .icon-btn { width: 36px; height: 40px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; cursor: pointer; color: var(--ink-2); }
  .icon-btn:hover { color: var(--critical); border-color: var(--critical); }

  /* ---------- approvals ---------- */
  .group { margin-bottom: 16px; }
  .group-head { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: baseline; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }
  .group-head .cust { font-weight: 700; font-size: 15px; }
  .group-head .meta { color: var(--ink-2); font-size: 12px; }
  .group .table-wrap { border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 16px; z-index: 30; box-shadow: 0 -4px 16px rgba(0,0,0,.06); display: none;
  }
  .actionbar.show { display: block; }
  .actionbar-inner { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .actionbar input { flex: 1; min-width: 200px; }
  .history { background: var(--surface-2); padding: 10px 14px; }
  .history h3 { font-size: 12px; margin: 6px 0; color: var(--ink-2); }

  /* ---------- dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .k { font-size: 12px; color: var(--ink-2); }
  .kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .s { font-size: 12px; color: var(--ink-3); }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
  .bar-track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; display: flex; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .cols { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--border); }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .col .colbar { width: 60%; max-width: 46px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col .colval { font-size: 12px; color: var(--ink-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .col-labels { display: flex; gap: 10px; margin-top: 6px; }
  .col-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--ink-3); }

  /* ---------- misc ---------- */
  .empty { text-align: center; color: var(--ink-3); padding: 40px 16px; }
  .loading { text-align: center; color: var(--ink-3); padding: 40px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 8px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px);
  }
  .toast.err { background: var(--critical); color: #fff; }
  .notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
  .notice.warn { border-left-color: var(--warning); background: var(--warning-bg); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters input[type=search] { max-width: 320px; }
  .filters select, .filters input[type=date] { width: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; background: var(--surface); cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .success-box { text-align: center; padding: 28px 16px; }
  .success-box .tick { width: 54px; height: 54px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 28px; margin: 0 auto 10px; }
  .hidden { display: none !important; }
  .gate { max-width: 420px; margin: 80px auto; text-align: center; }
</style>
