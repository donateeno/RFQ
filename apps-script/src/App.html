<script>
(function () {
  'use strict';

  // ================= helpers =================
  var S = {
    boot: null, route: '', prod: { EVE: {}, FOSTER: {} },
    pc: null, cart: null, mine: null, mineFilter: { status: '', q: '' },
    appr: null, sel: {}, mon: null, monFilter: { status: '', channel: '', indicator: '', q: '', from: '', to: '' },
    dash: null, dashFilter: { from: '', to: '', channel: '' }, admin: null, ap: { q: '', channel: '', includeExpired: false, rows: null }
  };

  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n, dp) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '–';
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: dp === undefined ? 0 : dp, maximumFractionDigits: 2 });
  }
  function pct(n, dp) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '–';
    return (Number(n) * 100).toFixed(dp === undefined ? 2 : dp) + '%';
  }
  function pctInput(frac) { return frac ? String(Math.round(frac * 10000) / 100) : '0'; }
  function fromPctInput(s) { var n = Number(String(s).replace('%', '').trim()); return isNaN(n) ? NaN : n / 100; }
  function dateTh(iso) {
    if (!iso) return '–';
    var p = iso.substring(0, 10).split('-');
    return p[2] + '/' + p[1] + '/' + p[0].substring(2);
  }
  function addDaysIso(iso, n) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function debounce(fn, ms) {
    var t;
    return function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms); };
  }
  function toast(msg, isErr) {
    var el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, isErr ? 6000 : 3000);
  }
  function fail(e) { toast(e && e.message ? e.message : String(e), true); }

  var IND = {
    'OKAY': { cls: 'OKAY', icon: '✓', msg: 'กำไรอยู่ในเกณฑ์ดี' },
    'LOW': { cls: 'LOW', icon: '!', msg: 'กำไรค่อนข้างต่ำ' },
    'VERY LOW': { cls: 'VERY_LOW', icon: '!!', msg: 'กำไรต่ำมาก — ควรทบทวนราคา' },
    'ขาดทุน': { cls: 'LOSS', icon: '✕', msg: 'ต่ำกว่าเกณฑ์ขั้นต่ำ — โอกาสอนุมัติน้อย' },
    'NO COST': { cls: 'NO_COST', icon: '?', msg: 'ไม่มีข้อมูลต้นทุน — หัวหน้าจะพิจารณาเอง' }
  };
  function indInfo(ind) { return IND[ind] || IND['NO COST']; }
  function indBadge(ind) {
    if (!ind) return '<span class="muted">–</span>';
    var i = indInfo(ind);
    return '<span class="ind ' + i.cls + '"><span class="dot">' + i.icon + '</span>' + esc(ind) + '</span>';
  }
  var STATUS_TH = { Pending: 'รออนุมัติ', Approved: 'อนุมัติ', Rejected: 'ไม่อนุมัติ', Cancelled: 'ยกเลิก', Expired: 'หมดอายุ', Closed: 'ปิด (เดิม)' };
  function statusBadge(s) { return '<span class="status ' + esc(s) + '">' + esc(STATUS_TH[s] || s) + '</span>'; }
  function flagsHtml(f) {
    if (!f) return '';
    return f.split(';').map(function (x) { x = x.trim(); return x ? '<span class="flag' + (x.indexOf('นำเข้า') === 0 ? '' : ' warn') + '">' + esc(x) + '</span>' : ''; }).join('');
  }
  function channel(id) { return S.boot.channels.filter(function (c) { return c.id === id; })[0]; }
  function channelName(id) { var c = channel(id); return c ? c.name : id; }
  function product(brand, key) { return key ? S.prod[brand][String(key).trim().toUpperCase()] : null; }
  function discText(r) {
    var c = channel(r.channel);
    var parts = [];
    (r.discounts || []).forEach(function (d, i) {
      if (c && !c.discounts[i].label) return;
      if (!c && !d) return;
      parts.push(pct(d, d * 100 % 1 ? 2 : 0));
    });
    return parts.join(' + ') || '–';
  }
  function canApprove() { return S.boot && S.boot.user.canApprove; }

  // ================= shell & routing =================
  function routes() {
    var r = [
      { id: 'check', label: 'ตรวจราคา' },
      { id: 'new', label: 'ขออนุมัติราคา' },
      { id: 'mine', label: 'คำขอของฉัน' },
      { id: 'approved', label: 'ราคาที่อนุมัติแล้ว' }
    ];
    if (canApprove()) {
      r.push({ sep: true });
      r.push({ id: 'approvals', label: 'รออนุมัติ', badge: S.boot.pendingCount });
      r.push({ id: 'monitor', label: 'คำขอทั้งหมด' });
      r.push({ id: 'dashboard', label: 'ภาพรวม' });
    }
    if (S.boot.user.isAdmin) r.push({ id: 'admin', label: 'ตั้งค่า' });
    return r;
  }

  function renderNav() {
    $('#tabs').innerHTML = routes().map(function (r) {
      if (r.sep) return '<span class="sep"></span>';
      return '<a href="#' + r.id + '" data-route="' + r.id + '" class="' + (S.route === r.id ? 'active' : '') + '">' + esc(r.label) +
        (r.badge ? ' <span class="badge">' + r.badge + '</span>' : '') + '</a>';
    }).join('');
    $$('#tabs a').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); go(a.getAttribute('data-route')); });
    });
  }

  function go(route) {
    var ids = routes().filter(function (r) { return r.id; }).map(function (r) { return r.id; });
    if (ids.indexOf(route) === -1) route = 'check';
    S.route = route;
    try { google.script.history.replace(null, null, route); } catch (e) { /* preview */ }
    renderNav();
    $('#actionbar').classList.remove('show');
    window.scrollTo(0, 0);
    ({ check: viewCheck, 'new': viewNew, mine: viewMine, approved: viewApproved,
      approvals: viewApprovals, monitor: viewMonitor, dashboard: viewDashboard, admin: viewAdmin })[route]();
  }

  function boot() {
    run('getBootstrap').then(function (b) {
      S.boot = b;
      b.products.forEach(function (p) { if (S.prod[p.b]) S.prod[p.b][String(p.k).toUpperCase()] = p; });
      ['EVE', 'FOSTER'].forEach(function (brand) {
        var list = b.products.filter(function (p) { return p.b === brand; });
        $('#dl-' + brand).innerHTML = list.map(function (p) {
          return '<option value="' + esc(p.k) + '">' + (p.n !== p.k ? esc(p.n) + ' · ' : '') + (p.p ? money(p.p) + ' ฿' : '') + '</option>';
        }).join('');
      });
      $('#dl-customers').innerHTML = (b.customers || []).map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
      $('#who').innerHTML = esc(b.user.name) + '<span class="role-chip">' + esc(b.user.role) + '</span><br><span>' + esc(b.user.email) + '</span>';
      var start = function (hash) { go((hash || '').replace('#', '') || (canApprove() && b.pendingCount ? 'approvals' : 'check')); };
      try { google.script.url.getLocation(function (loc) { start(loc.hash); }); } catch (e) { start(location.hash); }
    }).catch(function (e) {
      $('#view').innerHTML = '<div class="gate card"><h1>เข้าใช้งานไม่ได้</h1><p class="sub">' + esc(e.message) + '</p></div>';
    });
  }

  function page(title, sub, actions) {
    return '<div class="page-head"><div><h1>' + esc(title) + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' +
      (actions ? '<div class="row">' + actions + '</div>' : '') + '</div>';
  }

  function channelSeg(id, current) {
    return '<div class="seg" id="' + id + '">' + S.boot.channels.map(function (c) {
      return '<button type="button" data-ch="' + esc(c.id) + '" class="' + (c.id === current ? 'on' : '') + '" title="' + esc(c.description) + '">' + esc(c.name) + '</button>';
    }).join('') + '</div>';
  }

  function discountInputs(ch, values, prefix) {
    return ch.discounts.map(function (d, i) {
      if (!d.label) return '';
      return '<div class="field"><label>' + esc(d.label) + '</label><div class="pct-wrap"><input type="text" inputmode="decimal" class="num" data-' + prefix + '-disc="' + i + '" value="' + esc(values[i]) + '"' + (d.editable ? '' : ' disabled title="กำหนดโดยช่องทาง"') + '></div></div>';
    }).join('');
  }

  function defaultDiscs(ch) { return ch.discounts.map(function (d) { return pctInput(d.def); }); }
  function keyLabel(ch) { return ch.brand === 'FOSTER' ? 'Foster Code' : 'ชื่อสินค้า / เซ็ต'; }

  // ================= Price check =================
  function viewCheck() {
    if (!S.pc) {
      var ch0 = S.boot.channels[0];
      S.pc = { channelId: ch0.id, productKey: '', special: '', discs: defaultDiscs(ch0), result: null, busy: false };
    }
    var ch = channel(S.pc.channelId);
    $('#view').innerHTML = page('ตรวจราคา', 'ใส่ราคาที่จะเสนอลูกค้า ระบบจะบอกทันทีว่าราคานี้อยู่ในเกณฑ์หรือไม่ (ยังไม่บันทึก)') +
      '<div class="grid-2"><div class="card">' +
      '<div class="field" style="margin-bottom:14px"><span class="label">ช่องทาง</span>' + channelSeg('pc-ch', ch.id) + '</div>' +
      '<div class="fields">' +
      '<div class="field wide"><label for="pc-prod">' + keyLabel(ch) + '</label><input type="search" id="pc-prod" list="dl-' + ch.brand + '" autocomplete="off" placeholder="พิมพ์เพื่อค้นหา…" value="' + esc(S.pc.productKey) + '"><div class="hint" id="pc-prod-info"></div></div>' +
      '<div class="field"><label for="pc-special">ราคาขายพิเศษสุทธิ (รวม VAT)</label><input type="text" inputmode="decimal" class="num" id="pc-special" value="' + esc(S.pc.special) + '" placeholder="0"></div>' +
      discountInputs(ch, S.pc.discs, 'pc') +
      '</div>' +
      '<div class="row end" style="margin-top:16px"><button class="btn primary" id="pc-add">+ ใช้ราคานี้ขออนุมัติ</button></div>' +
      '</div><div class="card"><div id="pc-result"></div></div></div>';

    $$('#pc-ch button').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = channel(b.getAttribute('data-ch'));
        if (c.brand !== ch.brand) S.pc.productKey = '';
        S.pc.channelId = c.id; S.pc.discs = defaultDiscs(c); S.pc.result = null;
        viewCheck(); check();
      });
    });
    $('#pc-prod').addEventListener('input', function (e) { S.pc.productKey = e.target.value; prodInfo(); check(); });
    $('#pc-special').addEventListener('input', function (e) { S.pc.special = e.target.value; check(); });
    $$('[data-pc-disc]').forEach(function (inp) {
      inp.addEventListener('input', function () { S.pc.discs[Number(inp.getAttribute('data-pc-disc'))] = inp.value; check(); });
    });
    $('#pc-add').addEventListener('click', function () {
      if (!S.pc.productKey) return toast('กรุณาเลือกสินค้า', true);
      startCart(S.pc.channelId);
      var empty = S.cart.lines.filter(function (l) { return !l.productKey; })[0];
      var line = empty || newLine(channel(S.pc.channelId));
      line.productKey = S.pc.productKey; line.special = S.pc.special; line.discs = S.pc.discs.slice(); line.result = S.pc.result;
      if (!empty) S.cart.lines.push(line);
      go('new');
      toast('เพิ่มลงคำขอแล้ว — กรอกข้อมูลลูกค้าแล้วกดส่ง');
    });
    prodInfo();
    renderPcResult();

    function prodInfo() {
      var p = product(ch.brand, S.pc.productKey);
      $('#pc-prod-info').innerHTML = p
        ? (p.n !== p.k ? esc(p.n) + ' · ' : '') + 'ขายปกติ <b>' + money(p.p) + '</b> ฿'
        : (S.pc.productKey ? '<span style="color:var(--danger)">ไม่พบในรายการสินค้า</span>' : '');
    }
  }

  var check = debounce(function () {
    var pc = S.pc;
    var special = Number(String(pc.special).replace(/,/g, ''));
    if (!pc.productKey || !(special > 0)) { pc.result = null; renderPcResult(); return; }
    var discs = pc.discs.map(fromPctInput);
    if (discs.some(function (d) { return isNaN(d) || d < 0 || d >= 1; })) { pc.result = { error: 'ส่วนลดต้องอยู่ระหว่าง 0 – 99%' }; renderPcResult(); return; }
    pc.busy = true; renderPcResult();
    var payload = { channelId: pc.channelId, productKey: pc.productKey, specialPrice: special, discounts: discs };
    var stamp = JSON.stringify(payload);
    pc.stamp = stamp;
    run('priceCheck', payload).then(function (res) {
      if (pc.stamp !== stamp) return;
      pc.busy = false; pc.result = res; renderPcResult();
    }).catch(function (e) {
      if (pc.stamp !== stamp) return;
      pc.busy = false; pc.result = { error: e.message }; renderPcResult();
    });
  }, 450);

  function offerVsNormal(normal) {
    var diff = 1 - Number(String(S.pc.special).replace(/,/g, '')) / normal;
    if (Math.abs(diff) < 0.0005) return 'เท่ากับราคาปกติ';
    return 'ราคาที่เสนอ' + (diff > 0 ? 'ต่ำกว่า' : 'สูงกว่า') + 'ปกติ ' + pct(Math.abs(diff), 1);
  }

  function renderPcResult() {
    var box = $('#pc-result');
    if (!box) return;
    var r = S.pc.result;
    var scale = '<div class="scale">' + ['OKAY', 'LOW', 'VERY LOW', 'ขาดทุน'].map(indBadge).join('') + '</div>';
    if (S.pc.busy && !r) { box.innerHTML = '<div class="result"><span class="spin"></span></div>'; return; }
    if (!r) { box.innerHTML = '<div class="result"><div class="msg">เลือกสินค้าและใส่ราคาเพื่อดูผล</div>' + scale + '</div>'; return; }
    if (r.error) { box.innerHTML = '<div class="result"><div class="msg" style="color:var(--danger)">' + esc(r.error) + '</div></div>'; return; }
    var i = indInfo(r.indicator);
    var html = '<div class="result ' + i.cls + '">' +
      '<div class="big"><span class="dot">' + i.icon + '</span>' + esc(r.indicator) + (S.pc.busy ? ' <span class="spin"></span>' : '') + '</div>' +
      '<div class="msg">' + esc(i.msg) + '</div>' +
      (r.normalPrice ? '<div class="msg">ราคาขายปกติ ' + money(r.normalPrice) + ' ฿ · ' + offerVsNormal(r.normalPrice) + '</div>' : '') +
      (r.flags && r.flags.length ? '<div>' + r.flags.map(function (f) { return '<span class="flag warn">' + esc(f) + '</span>'; }).join('') + '</div>' : '') +
      '</div>';
    if (canApprove() && r.cost !== undefined) {
      html += '<dl class="kv"><dt>ต้นทุน / หน่วย</dt><dd>' + money(r.cost, 2) + '</dd>' +
        '<dt>สุทธิหลังส่วนลด (รวม VAT)</dt><dd>' + money(r.netIncVat, 2) + '</dd>' +
        '<dt>สุทธิ (ไม่รวม VAT)</dt><dd>' + money(r.netExVat, 2) + '</dd>' +
        '<dt>กำไร (Gain)</dt><dd>' + money(r.gain, 2) + '</dd>' +
        '<dt>%MU</dt><dd>' + pct(r.mu) + '</dd></dl>';
    }
    box.innerHTML = html + scale;
  }

  // ================= New request =================
  function newLine(ch) { return { productKey: '', qty: '1', special: '', discs: defaultDiscs(ch), result: null }; }
  function startCart(channelId) {
    var today = S.boot.today;
    if (S.cart && S.cart.channelId === channelId) return;
    if (S.cart && S.cart.lines.some(function (l) { return l.productKey; }) && S.cart.channelId !== channelId) {
      var keep = S.cart;
      S.cart = { channelId: channelId, customer: keep.customer, project: keep.project, note: keep.note, start: keep.start, end: keep.end, lines: [] };
      return;
    }
    S.cart = {
      channelId: channelId, customer: '', project: '', note: '', start: today,
      end: addDaysIso(today, S.boot.settings.defaultValidityDays), lines: []
    };
  }

  function viewNew() {
    if (!S.cart) startCart(S.boot.channels[0].id);
    if (!S.cart.lines.length) S.cart.lines.push(newLine(channel(S.cart.channelId)));
    var c = S.cart, ch = channel(c.channelId);
    var dc = ch.discounts.filter(function (d) { return d.label; });
    var maxEnd = addDaysIso(c.start || S.boot.today, S.boot.settings.maxValidityDays);
    $('#view').innerHTML = page('ขออนุมัติราคาพิเศษ', 'ส่งได้หลายรายการต่อครั้ง ทุกคำขอต้องได้รับอนุมัติจากหัวหน้า') +
      '<div class="card"><div class="field" style="margin-bottom:14px"><span class="label">ช่องทาง</span>' + channelSeg('nr-ch', ch.id) + '</div>' +
      '<div class="fields">' +
      '<div class="field"><label class="req" for="nr-cust">ชื่อคู่ค้า / ร้านค้า</label><input type="text" id="nr-cust" list="dl-customers" value="' + esc(c.customer) + '"></div>' +
      '<div class="field"><label for="nr-proj">สาขา / ชื่อโครงการ</label><input type="text" id="nr-proj" value="' + esc(c.project) + '"></div>' +
      '<div class="field"><label for="nr-start">เริ่มราคาพิเศษ</label><input type="date" id="nr-start" min="' + S.boot.today + '" value="' + esc(c.start) + '"></div>' +
      '<div class="field"><label for="nr-end">สิ้นสุด</label><input type="date" id="nr-end" min="' + esc(c.start) + '" max="' + maxEnd + '" value="' + esc(c.end) + '"><span class="hint">ค่าเริ่มต้น ' + S.boot.settings.defaultValidityDays + ' วัน · สูงสุด ' + S.boot.settings.maxValidityDays + ' วัน</span></div>' +
      '<div class="field wide"><label for="nr-note">หมายเหตุ / #Tag</label><input type="text" id="nr-note" placeholder="เช่น ส่งครั้งเดียว, แบ่งส่ง 2 ครั้ง, ลูกค้าเก่า" value="' + esc(c.note) + '"></div>' +
      '</div></div>' +
      '<div class="card" style="--disc-count:' + dc.length + '"><h2>รายการสินค้า</h2>' +
      '<div class="line-head"><span>' + keyLabel(ch) + '</span><span>จำนวน</span><span>ราคาพิเศษ (รวม VAT)</span>' +
      dc.map(function (d) { return '<span>' + esc(d.label) + '</span>'; }).join('') + '<span>Indicator</span><span></span></div>' +
      '<div id="nr-lines">' + c.lines.map(function (l, i) { return lineHtml(ch, l, i); }).join('') + '</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="nr-addline">+ เพิ่มสินค้า</button><span class="spacer"></span>' +
      '<button class="btn ghost" id="nr-clear">ล้างทั้งหมด</button><button class="btn primary" id="nr-submit">ส่งขออนุมัติ</button></div></div>';

    $$('#nr-ch button').forEach(function (b) {
      b.addEventListener('click', function () {
        var nc = channel(b.getAttribute('data-ch'));
        if (nc.id === c.channelId) return;
        var hasLines = c.lines.some(function (l) { return l.productKey; });
        if (hasLines && nc.brand !== ch.brand && !confirm('เปลี่ยนช่องทางเป็นแบรนด์อื่นจะล้างรายการสินค้า ต้องการต่อหรือไม่?')) return;
        c.channelId = nc.id;
        c.lines = nc.brand === ch.brand
          ? c.lines.map(function (l) { l.discs = defaultDiscs(nc); l.result = null; return l; })
          : [newLine(nc)];
        viewNew();
        c.lines.forEach(function (l, i) { lineCheck(i); });
      });
    });
    bindVal('#nr-cust', 'customer'); bindVal('#nr-proj', 'project'); bindVal('#nr-note', 'note');
    $('#nr-start').addEventListener('change', function (e) {
      c.start = e.target.value;
      if (!c.end || c.end < c.start) c.end = addDaysIso(c.start, S.boot.settings.defaultValidityDays);
      viewNew();
    });
    bindVal('#nr-end', 'end');
    $('#nr-addline').addEventListener('click', function () { c.lines.push(newLine(ch)); viewNew(); var last = $$('[data-l-prod]').pop(); if (last) last.focus(); });
    $('#nr-clear').addEventListener('click', function () { if (confirm('ล้างข้อมูลทั้งหมด?')) { S.cart = null; viewNew(); } });
    $('#nr-submit').addEventListener('click', submitCart);
    bindLines(ch);

    function bindVal(sel, key) { $(sel).addEventListener('input', function (e) { c[key] = e.target.value; }); }
  }

  function lineHtml(ch, l, i) {
    var p = product(ch.brand, l.productKey);
    var discs = ch.discounts.map(function (d, j) {
      if (!d.label) return '';
      return '<div class="field"><span class="label">' + esc(d.label) + '</span><div class="pct-wrap"><input type="text" inputmode="decimal" class="num" data-l-disc="' + i + ':' + j + '" value="' + esc(l.discs[j]) + '"' + (d.editable ? '' : ' disabled') + '></div></div>';
    }).join('');
    return '<div class="line" data-line="' + i + '">' +
      '<div class="field prod"><span class="label">' + keyLabel(ch) + '</span><input type="search" list="dl-' + ch.brand + '" autocomplete="off" data-l-prod="' + i + '" value="' + esc(l.productKey) + '" placeholder="พิมพ์เพื่อค้นหา…"><div class="np" id="np-' + i + '">' + npText(p, l) + '</div></div>' +
      '<div class="field"><span class="label">จำนวน</span><input type="text" inputmode="numeric" class="num" data-l-qty="' + i + '" value="' + esc(l.qty) + '"></div>' +
      '<div class="field"><span class="label">ราคาพิเศษ (รวม VAT)</span><input type="text" inputmode="decimal" class="num" data-l-special="' + i + '" value="' + esc(l.special) + '"><div class="np"></div></div>' +
      discs +
      '<div class="ind-cell" id="li-' + i + '">' + lineInd(l) + '</div>' +
      '<div><button class="icon-btn" data-l-del="' + i + '" title="ลบรายการ">✕</button></div></div>';
  }
  function npText(p, l) {
    if (p) return (p.n !== p.k ? esc(p.n) + ' · ' : '') + 'ปกติ ' + money(p.p) + ' ฿';
    return l.productKey ? '<span style="color:var(--danger)">ไม่พบในรายการ (จะส่งแบบไม่มีต้นทุน)</span>' : '';
  }
  function lineInd(l) {
    if (l.busy) return '<span class="spin"></span>';
    if (!l.result) return '<span class="muted">–</span>';
    if (l.result.error) return '<span class="flag warn">' + esc(l.result.error) + '</span>';
    return indBadge(l.result.indicator) + (canApprove() && l.result.mu !== undefined ? '<div class="muted">MU ' + pct(l.result.mu) + '</div>' : '');
  }

  var lineTimers = {};
  function lineCheck(i) {
    clearTimeout(lineTimers[i]);
    lineTimers[i] = setTimeout(function () {
      var c = S.cart, l = c.lines[i];
      if (!l) return;
      var special = Number(String(l.special).replace(/,/g, ''));
      if (!l.productKey || !(special > 0)) { l.result = null; paint(); return; }
      var discs = l.discs.map(fromPctInput);
      if (discs.some(function (d) { return isNaN(d) || d < 0 || d >= 1; })) { l.result = { error: 'ส่วนลด 0–99%' }; paint(); return; }
      var stamp = JSON.stringify([c.channelId, l.productKey, special, discs]);
      l.stamp = stamp; l.busy = true; paint();
      run('priceCheck', { channelId: c.channelId, productKey: l.productKey, specialPrice: special, discounts: discs })
        .then(function (res) { if (l.stamp === stamp) { l.busy = false; l.result = res; paint(); } })
        .catch(function (e) { if (l.stamp === stamp) { l.busy = false; l.result = { error: e.message }; paint(); } });
      function paint() { var el = $('#li-' + i); if (el && S.cart.lines[i] === l) el.innerHTML = lineInd(l); }
    }, 450);
  }

  function bindLines(ch) {
    var c = S.cart;
    $$('[data-l-prod]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var i = Number(inp.getAttribute('data-l-prod')); c.lines[i].productKey = inp.value;
        $('#np-' + i).innerHTML = npText(product(ch.brand, inp.value), c.lines[i]);
        lineCheck(i);
      });
    });
    $$('[data-l-qty]').forEach(function (inp) {
      inp.addEventListener('input', function () { c.lines[Number(inp.getAttribute('data-l-qty'))].qty = inp.value; });
    });
    $$('[data-l-special]').forEach(function (inp) {
      inp.addEventListener('input', function () { var i = Number(inp.getAttribute('data-l-special')); c.lines[i].special = inp.value; lineCheck(i); });
    });
    $$('[data-l-disc]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var p = inp.getAttribute('data-l-disc').split(':').map(Number);
        c.lines[p[0]].discs[p[1]] = inp.value; lineCheck(p[0]);
      });
    });
    $$('[data-l-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        c.lines.splice(Number(b.getAttribute('data-l-del')), 1);
        viewNew();
      });
    });
  }

  function submitCart() {
    var c = S.cart, ch = channel(c.channelId);
    if (!c.customer.trim()) { toast('กรุณาใส่ชื่อคู่ค้า / ร้านค้า', true); $('#nr-cust').focus(); return; }
    var lines = c.lines.filter(function (l) { return l.productKey.trim() || String(l.special).trim(); });
    if (!lines.length) return toast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ', true);
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (!l.productKey.trim()) return toast('รายการที่ ' + (i + 1) + ': กรุณาเลือกสินค้า', true);
      if (!(Number(String(l.special).replace(/,/g, '')) > 0)) return toast('รายการที่ ' + (i + 1) + ': กรุณาใส่ราคาพิเศษ', true);
      if (!/^\d+$/.test(String(l.qty).trim()) || Number(l.qty) < 1) return toast('รายการที่ ' + (i + 1) + ': จำนวนต้องเป็นเลขจำนวนเต็ม', true);
    }
    var unknown = lines.filter(function (l) { return !product(ch.brand, l.productKey); }).length;
    if (unknown && !confirm(unknown + ' รายการไม่พบในฐานข้อมูลสินค้า (ไม่มีต้นทุน) ต้องการส่งต่อหรือไม่?')) return;
    var btn = $('#nr-submit');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังส่ง…';
    run('submitRequest', {
      channelId: c.channelId, customer: c.customer, project: c.project, note: c.note,
      startDate: c.start, endDate: c.end,
      lines: lines.map(function (l) {
        return {
          productKey: l.productKey.trim(), qty: Number(l.qty),
          specialPrice: Number(String(l.special).replace(/,/g, '')),
          discounts: l.discs.map(fromPctInput)
        };
      })
    }).then(function (res) {
      S.cart = null; S.mine = null;
      if (canApprove()) { S.boot.pendingCount = (S.boot.pendingCount || 0) + res.lines.length; renderNav(); }
      $('#view').innerHTML = '<div class="card success-box"><div class="tick">✓</div><h1>ส่งคำขอแล้ว</h1>' +
        '<p class="sub">หัวหน้าจะได้รับอีเมลแจ้งเตือน และคุณจะได้รับอีเมลเมื่อมีผลการพิจารณา</p>' +
        '<div class="table-wrap" style="margin:16px auto;max-width:640px;text-align:left"><table><thead><tr><th>Req. Id.</th><th>สินค้า</th><th class="num">ราคาพิเศษ</th><th>Indicator</th></tr></thead><tbody>' +
        res.lines.map(function (r) { return '<tr><td class="nowrap"><b>' + esc(r.id) + '</b></td><td>' + esc(r.productName) + '</td><td class="num">' + money(r.specialPrice) + '</td><td>' + indBadge(r.indicator) + '</td></tr>'; }).join('') +
        '</tbody></table></div><div class="row" style="justify-content:center"><button class="btn" id="ok-mine">ดูคำขอของฉัน</button><button class="btn primary" id="ok-new">ขออนุมัติรายการใหม่</button></div></div>';
      $('#ok-mine').addEventListener('click', function () { go('mine'); });
      $('#ok-new').addEventListener('click', function () { viewNew(); });
    }).catch(function (e) {
      fail(e); btn.disabled = false; btn.textContent = 'ส่งขออนุมัติ';
    });
  }

      '<div class="filters"><div class="chips" id="mine-chips"></div><span class="spacer"></span><input type="search" id="mine-q" placeholder="ค้นหา ลูกค้า / สินค้า / Req. Id." value="' + esc(S.mineFilter.q) + '"></div>' +

      .filter(function (s) { return counts[s]; }).map(function (s) { return [s, STATUS_TH[s], counts[s]]; }))
      .map(function (c) { return '<button class="chip' + (S.mineFilter.status === c[0] ? ' on' : '') + '" data-st="' + c[0] + '">' + esc(c[1]) + ' ' + c[2] + '</button>'; }).join('');

      '<div class="table-wrap"><table class="cards"><thead><tr><th></th><th>Req. Id.</th><th>วันที่ขอ</th><th>คู่ค้า / โครงการ</th><th>สินค้า</th><th class="num">จำนวน</th><th class="num">ราคาพิเศษ</th><th>ส่วนลด</th><th>Indicator</th><th>สถานะ</th><th>ใช้ได้ถึง</th><th>หมายเหตุผู้อนุมัติ</th></tr></thead><tbody>' +
      list.map(function (r) {

          '<td data-label="วันที่ขอ" class="nowrap">' + dateTh(r.requestedAt) + '</td>' +
          '<td data-label="คู่ค้า">' + esc(r.customer) + (r.project ? '<div class="muted">' + esc(r.project) + '</div>' : '') + '</td>' +
          '<td data-label="สินค้า">' + esc(r.productName) + (r.productName !== r.productKey ? '<div class="muted">' + esc(r.productKey) + '</div>' : '') + '</td>' +
          '<td data-label="จำนวน" class="num">' + (r.qty || '–') + '</td>' +
          '<td data-label="ราคาพิเศษ" class="num">' + money(r.specialPrice) + '<div class="muted">ปกติ ' + money(r.normalPrice) + '</div></td>' +
          '<td data-label="ส่วนลด" class="nowrap">' + discText(r) + '</td>' +

          '<td data-label="ใช้ได้" class="nowrap">' + dateTh(r.startDate) + ' – ' + dateTh(r.endDate) + '</td>' +
          '<td data-label="หมายเหตุ">' + esc(r.comment) + (r.decidedBy ? '<div class="muted">' + esc(r.decidedBy) + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    var btn = $('#mine-cancel');
    if (!btn) return;
    var pick = function () { return $$('[data-cancel]').filter(function (c) { return c.checked; }).map(function (c) { return c.getAttribute('data-cancel'); }); };
    $$('[data-cancel]').forEach(function (c) { c.addEventListener('change', function () { btn.disabled = !pick().length; }); });
    btn.addEventListener('click', function () {
      var ids = pick();
      if (!confirm('ยกเลิก ' + ids.length + ' รายการ?')) return;
      run('cancelMyRequests', ids).then(function (res) {
        toast('ยกเลิกแล้ว ' + res.updated.length + ' รายการ');
        S.mine = null; viewMine();
      }).catch(fail);
    });
  }

      '<div class="filters"><input type="search" id="ap-q" placeholder="ค้นหา ลูกค้า / สินค้า / โครงการ" value="' + esc(ap.q) + '" style="max-width:420px">' +
      '<select id="ap-ch"><option value="">ทุกช่องทาง</option>' + S.boot.channels.map(function (c) { return '<option value="' + esc(c.id) + '"' + (ap.channel === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' +

  // ================= Approvals (supervisor) =================

  function cssEsc(s) { return String(s).replace(/(["\\])/g, '\\$1'); }

  function decide(decision) {
    var ids = Object.keys(S.sel);
    var comment = $('#dec-comment').value.trim();
    if (decision === 'Rejected' && !comment) { toast('กรุณาใส่เหตุผลที่ไม่อนุมัติ', true); $('#dec-comment').focus(); return; }
    var risky = (S.appr || []).filter(function (r) { return S.sel[r.id] && (r.indicator === 'ขาดทุน' || r.indicator === 'NO COST'); }).length;
    var msg = (decision === 'Approved' ? 'อนุมัติ ' : 'ไม่อนุมัติ ') + ids.length + ' รายการ?' +
      (decision === 'Approved' && risky ? '\n\n⚠ มี ' + risky + ' รายการที่ขาดทุนหรือไม่มีต้นทุน' : '');
    if (!confirm(msg)) return;
    $$('#actionbar button').forEach(function (b) { b.disabled = true; });
    run('decideRequests', { ids: ids, decision: decision, comment: comment }).then(function (res) {
      toast((decision === 'Approved' ? 'อนุมัติ' : 'ไม่อนุมัติ') + 'แล้ว ' + res.updated.length + ' รายการ' + (res.skipped.length ? ' (ข้าม ' + res.skipped.length + ' ที่มีคนพิจารณาไปแล้ว)' : ''));
      S.ap.rows = null; S.mon = null;
      viewApprovals();
    }).catch(function (e) { fail(e); renderActionBar(); });
  }

  function downloadCsv() {
    var rows = S.mon || [];
    var cols = [['id', 'Req. Id.'], ['channel', 'Channel'], ['requestedAt', 'Requested'], ['customer', 'Customer'], ['project', 'Project'], ['note', 'Note'],
      ['productKey', 'Product key'], ['productName', 'Product'], ['qty', 'Qty'], ['normalPrice', 'Normal price'], ['specialPrice', 'Special price'],
      ['d1', 'Disc 1'], ['d2', 'Disc 2'], ['d3', 'Disc 3'], ['cost', 'Cost'], ['netExVat', 'Net ex VAT'], ['gain', 'Gain'], ['mu', '%MU'],
      ['indicator', 'Indicator'], ['displayStatus', 'Status'], ['startDate', 'Start'], ['endDate', 'End'], ['requester', 'Requester'],
      ['decidedBy', 'Decided by'], ['decidedAt', 'Decided at'], ['comment', 'Comment'], ['flags', 'Flags']];
    var lines = [cols.map(function (c) { return c[1]; })].concat(rows.map(function (r) {
      return cols.map(function (c) {
        if (c[0] === 'd1' || c[0] === 'd2' || c[0] === 'd3') return r.discounts[Number(c[0].charAt(1)) - 1];
        return r[c[0]];
      });
    }));
    var csv = '\ufeff' + lines.map(function (l) {
      return l.map(function (v) { v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'rfq-requests-' + S.boot.today + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

      a.users.map(function (u) { return '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.role) + '</td><td>' + (u.active ? '✓' : '–') + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="hint">คนอื่นที่ใช้อีเมล @eve.co.th จะเป็น SALES อัตโนมัติ · <a href="' + esc(a.sheetUrl) + '" target="_blank">เปิดชีต</a></p></div>' +
      '<div class="card"><h2>เกณฑ์และค่าตั้งต้น</h2><div class="fields" id="adm-settings">' +
      a.settings.filter(function (s) { return editable.indexOf(s.key) !== -1; }).map(function (s) {
        var isPct = /^MU_|VAT/.test(s.key);
        return '<div class="field wide"><label>' + esc(s.key) + '</label>' +
          (isPct ? '<div class="pct-wrap"><input type="text" class="num" data-set="' + esc(s.key) + '" data-pct="1" value="' + esc(pctInput(Number(s.value))) + '"></div>'
            : '<input type="text" data-set="' + esc(s.key) + '" value="' + esc(s.value) + '">') +
          '<span class="hint">' + esc(s.description) + '</span></div>';
      }).join('') + '</div><div class="row end" style="margin-top:12px"><button class="btn primary" id="adm-save">บันทึก</button></div></div></div>';

    $('#adm-refresh').addEventListener('click', function (e) {
      var b = e.target; b.disabled = true; b.innerHTML = '<span class="spin"></span> กำลังอัปเดต…';
      run('refreshProducts').then(function (r) { toast('อัปเดตสินค้า ' + r.count + ' รายการ (โหลดหน้าใหม่เพื่อใช้รายการล่าสุด)'); viewAdmin(); }).catch(function (er) { fail(er); b.disabled = false; });
    });
    $('#adm-import').addEventListener('click', function (e) {
      if (!confirm('นำเข้าข้อมูลจากชีตเดิม?')) return;
      var b = e.target; b.disabled = true; b.innerHTML = '<span class="spin"></span> กำลังนำเข้า…';
      run('importLegacy').then(function (rep) {
        b.disabled = false; b.textContent = '⇪ นำเข้าข้อมูลเดิม';
        $('#adm-import-res').innerHTML = '<div class="notice" style="margin-top:10px">' + rep.map(function (r) {
          return esc(r.sheet) + ': นำเข้า ' + r.imported + ', ข้าม ' + r.skipped + (r.error ? ' — <span style="color:var(--danger)">' + esc(r.error) + '</span>' : '');
        }).join('<br>') + '</div>';
        S.mon = null; S.ap.rows = null;
      }).catch(function (er) { fail(er); b.disabled = false; });
    });
    $('#adm-save').addEventListener('click', function () {
      var changes = {};
      $$('[data-set]').forEach(function (i) { changes[i.getAttribute('data-set')] = i.getAttribute('data-pct') ? fromPctInput(i.value) : i.value; });
      run('saveSettings', changes).then(function (info) { toast('บันทึกแล้ว'); renderAdmin(info); }).catch(fail);
    });
  }

  boot();
})();
</script>
